<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'login')}">

<body>

  <div class="row justify-content-center">
    <div class="col-md-6">
      <h2 class="text-center mb-4">Sign In</h2>

      <div th:if="${error}" class="alert alert-danger" role="alert">
        <span th:text="${error}">Invalid username or password</span>
      </div>

      <form th:action="@{/login}" method="post" class="form-horizontal">
        <div class="form-group mb-3">
          <label class="form-label" for="username">Username</label>
          <input type="text" id="username" name="username" class="form-control" required="required"
            placeholder="Enter your username" />
        </div>

        <div class="form-group mb-3">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" name="password" class="form-control" required="required"
            placeholder="Enter your password" />
        </div>

        <div class="form-group mb-3">
          <button type="submit" class="btn btn-primary w-100">Sign In</button>
        </div>
      </form>

      <div class="text-center mb-3">
        <span class="text-muted">Don't have an account?</span>
        <a th:href="@{/register}" class="text-decoration-none">Register</a>
      </div>

      <hr />

      <div class="text-center">
        <h5 class="mb-3">Or sign in with</h5>
        <a th:href="@{/oauth2/authorization/google}" class="btn btn-outline-danger w-100">
          <i class="fa fa-google"></i> Sign in with Google
        </a>
      </div>

    </div>
  </div>

</body>

</html>
