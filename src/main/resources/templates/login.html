<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}">
    <title>Login</title>
</head>
<body>
<nav th:replace="~{fragments/layout :: navigation}"></nav>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="text-center mb-4">Login to PetClinic</h2>
            <div th:if="${param.error}" class="alert alert-danger">
                Invalid username or password.
            </div>
            <div th:if="${param.logout}" class="alert alert-info">
                You have been logged out.
            </div>
            <form th:action="@{/login}" method="post">
                <div class="form-group mb-3">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" class="form-control" required autofocus>
                </div>
                <div class="form-group mb-3">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Sign in</button>
            </form>
            <div class="mt-4 p-3 bg-light rounded">
                <h5>Test Accounts:</h5>
                <p><strong>Clinic 1 (Downtown):</strong> admin1 / password</p>
                <p><strong>Clinic 2 (Westside):</strong> admin2 / password</p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
